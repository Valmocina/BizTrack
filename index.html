<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BizTrack</title>

    <!-- og:title and og:description are injected by vite.config.ts from .figma/make/site.json -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BizTrack" />
    <meta property="og:url" content="https://valmocina.github.io/BizTrack/" />

    <!-- SPA Redirect Handler -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
